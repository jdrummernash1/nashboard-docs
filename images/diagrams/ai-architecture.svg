<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 850" width="1140" height="850" role="img" aria-labelledby="ttl desc" font-family="Segoe UI, system-ui, sans-serif">
<title id="ttl">The AI architecture</title>
<desc id="desc">Two uses of AI. In the app, Home Assistant Assist and AI Task use Ollama for private jobs and Gemini for non-private ones. On the build side, the owner uses the autopilot panel to wake the main Claude chat, which uses helper agents and the ai-worker routing step; every result is reviewed, checked and deployed.</desc>
<style>
