<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 850" width="1140" height="850" role="img" aria-labelledby="ttl desc" font-family="Segoe UI, system-ui, sans-serif">
<title id="ttl">Build swarm, quality checks, stuck watcher and demo mode</title>
<desc id="desc">The main Opus chat sends work to up to 20 Sonnet helpers and one Fable helper per build, then integrates their results. Quality checks gapcheck, overlapcheck, rightnowcheck, namecheck, genericcheck, flowcheck, scrollcheck, loadcheck and savecheck, plus the build, yamlcheck, mapcheck, legendcheck, datacheck and perfcheck, must pass before backup and deploy. A stuck watcher started by Claude Code hooks runs stuck-check every five minutes and wakes the main chat. Demo mode opens the same page on made-up sample data, read-only.</desc>
<style>
  .bg{fill:#f6f7fb;stroke:#e4e7ee}
  .card{fill:#ffffff;stroke:#dfe3ec;stroke-width:1.2}
  .t{font:700 14px "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;fill:#1b2130}
  .s{font:500 12px "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;fill:#566074}
  .gl{font:700 11.5px "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;fill:#6b7385;letter-spacing:.08em;text-transform:uppercase}
  .ttl{font:800 17px "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;fill:#1b2130}
  .lb{font:600 11.5px "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;fill:#3a4357}
  .lbbg{fill:#ffffff;stroke:#dfe3ec;stroke-width:1}
  .grp{fill:rgba(120,130,150,.07);stroke:#c4cad8;stroke-width:1.4;stroke-dasharray:none}
  .grpd{fill:rgba(120,130,150,.05);stroke:#b7bfd0;stroke-width:1.3;stroke-dasharray:3 5}
  .ic{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ic .f{fill:currentColor}
  .e{fill:none;stroke:#59627a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .et{fill:none;stroke:#e08a00;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
  .ed{fill:none;stroke:#59627a;stroke-width:2;stroke-dasharray:2 6;stroke-linecap:round;stroke-linejoin:round}
  .ar{fill:#59627a}.art{fill:#e08a00}
  .shadow{filter:url(#sh)}
  .num{stroke:none;fill:currentColor;font:800 14px "Segoe UI",system-ui,sans-serif}
  /* node colour kinds: tint / ring / icon chip */
  .k-acc .tint{fill:#fff3dc;stroke:#f2c06a}.k-acc .chip{fill:#ffb547}.k-acc .icn{stroke:#4a2f00;color:#4a2f00}
  .k-info .tint{fill:#e6f1ff;stroke:#a9cdf6}.k-info .chip{fill:#4f9df0}.k-info .icn{stroke:#fff;color:#fff}
  .k-ok .tint{fill:#e2f8ee;stroke:#97dcbc}.k-ok .chip{fill:#27b57a}.k-ok .icn{stroke:#fff;color:#fff}
  .k-vio .tint{fill:#efe9ff;stroke:#cabaf6}.k-vio .chip{fill:#8b6ff0}.k-vio .icn{stroke:#fff;color:#fff}
  .k-warn .tint{fill:#ffe9e5;stroke:#f5b5ab}.k-warn .chip{fill:#ef5e4d}.k-warn .icn{stroke:#fff;color:#fff}
  .k-neu .tint{fill:#f1f3f8;stroke:#d2d7e3}.k-neu .chip{fill:#6c768d}.k-neu .icn{stroke:#fff;color:#fff}
  @media (prefers-color-scheme: dark){
    .bg{fill:#141922;stroke:#262d3a}
    .card{fill:#1b212c;stroke:#2d3646}
    .t,.ttl{fill:#eef1f6}
    .s{fill:#a3adc0}
    .gl{fill:#8f9ab0}
    .lb{fill:#d3d9e6}
    .lbbg{fill:#1b212c;stroke:#2d3646}
    .grp{fill:rgba(160,175,205,.06);stroke:#3a4458}
    .grpd{fill:rgba(160,175,205,.04);stroke:#444f66}
    .e,.ed{stroke:#9aa5bd}.ar{fill:#9aa5bd}
    .et{stroke:#ffb547}.art{fill:#ffb547}
    .k-acc .tint{fill:#33290f;stroke:#7a5a1c}.k-acc .chip{fill:#ffb547}.k-acc .icn{stroke:#3a2500;color:#3a2500}
    .k-info .tint{fill:#13263d;stroke:#2f5c93}.k-info .chip{fill:#5aa9ff}.k-info .icn{stroke:#06182c;color:#06182c}
    .k-ok .tint{fill:#11291f;stroke:#25704f}.k-ok .chip{fill:#3ddc97}.k-ok .icn{stroke:#04210f;color:#04210f}
    .k-vio .tint{fill:#241d3d;stroke:#5a4a9c}.k-vio .chip{fill:#a78bfa}.k-vio .icn{stroke:#160c3a;color:#160c3a}
    .k-warn .tint{fill:#3a1a17;stroke:#8a3f36}.k-warn .chip{fill:#ff6b5b}.k-warn .icn{stroke:#3a0a05;color:#3a0a05}
    .k-neu .tint{fill:#232a37;stroke:#3b4558}.k-neu .chip{fill:#8b93a3}.k-neu .icn{stroke:#10141b;color:#10141b}
  }
</style>
